# Self-host SocialReins: Postgres, brain (API) and web. See README "Self-host".
#   cp .env.example .env   # set POSTGRES_PASSWORD, BRAIN_URL and WEB_URL
#   docker compose up -d
# Upgrade: docker compose pull && docker compose up -d (brain migrates on start).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialreins
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: socialreins
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialreins -d socialreins"]
      interval: 5s
      timeout: 5s
      retries: 20

  brain:
    image: ghcr.io/socialreins/brain:${SOCIALREINS_VERSION:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://socialreins:${POSTGRES_PASSWORD}@postgres:5432/socialreins
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:${BRAIN_PORT:-8080}:8080"]

  web:
    image: ghcr.io/socialreins/web:${SOCIALREINS_VERSION:-main}
    restart: unless-stopped
    environment:
      BRAIN_URL: ${BRAIN_URL:-http://localhost:8080}
    depends_on: [brain]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]

volumes:
  postgres:
